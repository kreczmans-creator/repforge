name: Legacy ZIP build (manual only)

# LEGACY. Builds the retired Kotlin prototype from the ZIP archive. Kept on
# manual trigger only until the ZIPs are removed under ADR-0003; it is known
# to fail on the archive's own compile errors (docs/wp0/D01 §3).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check source archive exists
        run: |
          if [ ! -f RepForge-v0.3.0-Android-source.zip ]; then
            echo "::error::Upload the RepForge Android project ZIP as RepForge-Android-Project.zip in the repository root."
            exit 1
          fi

      - name: Extract Android project
        run: |
          unzip -q RepForge-v0.3.0-Android-source.zip
          test -f repforge-android/settings.gradle.kts
          test -f repforge-android/app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: repforge-android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RepForge-debug-apk
          path: repforge-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
