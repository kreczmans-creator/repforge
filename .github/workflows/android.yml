name: Android build

on:
  push:
    branches: ["**"]
    paths: ["app/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  debug-apk:
    name: Quality gates and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies (pinned)
        run: flutter pub get --enforce-lockfile

      - name: Verify generated code is current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        run: flutter test --coverage --reporter expanded

      # Stable test certificate (WP 14). A hosted runner has no debug keystore,
      # so Gradle generates a new one on every run and two CI builds then carry
      # different certificates; Android refuses to install one over the other
      # (an uninstall, and the data loss it brings, is needed). The ONLY writer
      # of the shared keystore is debug-release.yml (single concurrency group,
      # saves immediately after creating it). This workflow only RESTORES it
      # (fixed key repforge-debug-keystore-v1) and never saves, so two runs
      # cannot race to create different keystores. On a miss (the entry has
      # not been created yet, or was evicted after 7 days unused) this build
      # uses a throwaway keystore: it is valid but its certificate will not
      # match the rolling release. A committed keystore is forbidden by the
      # engineering standards (section 9); the debug identity (public password
      # "android") signs test builds only.
      # AGP resolves the debug keystore through ANDROID_USER_HOME (falling back
      # to the deprecated ANDROID_SDK_HOME and then the user home). The first
      # CI run of the signer check (run 42329685501) proved that on the hosted
      # runner AGP signed with a keystore other than ~/.android/debug.keystore,
      # so the location is pinned explicitly to the one keytool writes.
      - name: Pin the Android user home for Gradle
        run: |
          mkdir -p "$HOME/.android"
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          env | grep -i '^ANDROID' || true

      - name: Restore stable debug keystore (cache, read-only)
        id: debug-keystore
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: repforge-debug-keystore-v1

      - name: Create throwaway debug keystore on cache miss
        if: steps.debug-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "::warning::Debug keystore cache missed; this build uses a throwaway keystore. Run debug-release.yml to create the shared one."

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Keystore locations after the build (diagnostic)
        if: always()
        run: |
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME"
          find "$HOME" /tmp -name 'debug.keystore' -print 2>/dev/null || true

      # Release builds run R8 (code and resource shrinking) by default, which
      # the debug build does not exercise. Debug signing is configured for the
      # release build type in android/app/build.gradle.kts, so this needs no
      # secrets; it is a build check, not a distributable artifact.
      - name: Build release APK (R8 check)
        run: flutter build apk --release

      - name: Report APKs
        run: |
          ls -l build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
          ls -l build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      # WP 14 release verification: signature and package metadata of both
      # APKs, printed into the log as build evidence. `--print-certs` includes
      # the signer certificate SHA-256, which must stay the same from run to
      # run now that the debug keystore is restored from the cache.
      - name: Verify APK signatures and metadata
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-release.apk; do
            echo "== $apk"
            "$tools/apksigner" verify --print-certs "$apk"
            "$tools/aapt2" dump badging "$apk" | grep -E "^package:|^application-label:|sdkVersion|targetSdkVersion"
          done

      # In-run proof that AGP signed with the cached keystore: the certificate
      # SHA-256 of both APKs must equal the one keytool reads from
      # ~/.android/debug.keystore. A mismatch fails the run, so even the first
      # run shows the stable-certificate mechanism works.
      - name: Signer matches the debug keystore
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          expected="$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')"
          test -n "$expected" || { echo "::error::Could not read the keystore certificate."; exit 1; }
          echo "Keystore certificate SHA-256: $expected"
          for apk in build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-release.apk; do
            actual="$("$tools/apksigner" verify --print-certs "$apk" | awk '/certificate SHA-256 digest/{print $NF; exit}')"
            echo "$apk signer SHA-256: $actual"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$apk is not signed with ~/.android/debug.keystore."
              exit 1
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: repforge-android-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
