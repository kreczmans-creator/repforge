name: Android build

on:
  push:
    branches: ["**"]
    paths: ["app/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  debug-apk:
    name: Quality gates and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies (pinned)
        run: flutter pub get --enforce-lockfile

      - name: Verify generated code is current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        run: flutter test --coverage --reporter expanded

      # Stable test certificate (WP 14). A hosted runner has no debug keystore,
      # so Gradle generates a new one on every run and two CI builds then carry
      # different certificates; Android refuses to install one over the other
      # (an uninstall, and the data loss it brings, is needed). This step keeps
      # ONE standard Android debug identity across runs by restoring
      # ~/.android/debug.keystore from the Actions cache under a fixed key and
      # creating it with keytool only on a cache miss. If GitHub evicts the
      # cache entry (unused for 7 days, or cache over quota) a new keystore is
      # generated and testers must uninstall once; bump the key suffix only to
      # force that on purpose. The keystore is never committed: the engineering
      # standards (section 9) forbid committing keystores, and a debug identity
      # with the public password "android" signs test builds only, never a
      # release. The certificate SHA-256 appears in the "Verify APK signatures
      # and metadata" step (apksigner --print-certs).
      - name: Restore stable debug keystore (cache)
        id: debug-keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: repforge-debug-keystore-v1

      - name: Create debug keystore on cache miss
        if: steps.debug-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "Generated a new debug keystore (cache miss); the cache saves it at the end of the job."

      - name: Build debug APK
        run: flutter build apk --debug

      # Release builds run R8 (code and resource shrinking) by default, which
      # the debug build does not exercise. Debug signing is configured for the
      # release build type in android/app/build.gradle.kts, so this needs no
      # secrets; it is a build check, not a distributable artifact.
      - name: Build release APK (R8 check)
        run: flutter build apk --release

      - name: Report APKs
        run: |
          ls -l build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
          ls -l build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      # WP 14 release verification: signature and package metadata of both
      # APKs, printed into the log as build evidence. `--print-certs` includes
      # the signer certificate SHA-256, which must stay the same from run to
      # run now that the debug keystore is restored from the cache.
      - name: Verify APK signatures and metadata
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-release.apk; do
            echo "== $apk"
            "$tools/apksigner" verify --print-certs "$apk"
            "$tools/aapt2" dump badging "$apk" | grep -E "^package:|^application-label:|sdkVersion|targetSdkVersion"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: repforge-android-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
