name: Integration tests (Android emulator)

on:
  push:
    branches: ["**"]
    paths: ["app/**", ".github/workflows/integration.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  android-emulator:
    name: integration_test on API 34 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40 # emulator boot + build take ~8 min; a hung test must not cost an hour
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # WP 14: the emulator exits at start-up when the runner's disk is nearly
      # full ("FATAL | Not enough space to create userdata partition.
      # Available: 7255 MB ... need 7372 MB", run 42305104781; the same
      # symptom on main run 42293964654). Removing tool-chains this job never
      # uses frees about 20 GB, and the explicit partition size below keeps
      # the requirement well under what is left.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h / | tail -1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies (pinned)
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Run integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # WP 14: the hosted emulator sometimes never reports boot within
          # the default 600 s (run 42293964654 on main, 2026-11-06, no test
          # ran). A longer wait costs nothing on a healthy boot and turns a
          # slow boot from an infrastructure failure into a result.
          emulator-boot-timeout: 900
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: app
          script: flutter test integration_test --reporter expanded
