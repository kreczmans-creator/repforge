name: CI

on:
  push:
    branches: ["**"]
    paths: ["app/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  quality:
    name: Format, analyse, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version (must match .fvmrc)
        run: |
          flutter --version
          test "$(flutter --version | head -1 | awk '{print $2}')" = "$FLUTTER_VERSION"

      - name: Resolve dependencies (pinned)
        run: flutter pub get --enforce-lockfile

      - name: Verify generated code is current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        run: flutter test --coverage --reporter expanded

      # Owner decision at WP 3 acceptance (2026-11-04): 80 % line coverage of
      # hand-written code, generated files excluded. Not lowered without an
      # ADR and owner approval (engineering standards §7).
      - name: Coverage gate (80 % of hand-written code)
        run: dart run tool/coverage_gate.dart coverage/lcov.info --min 80

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: app/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14
