name: Debug release (latest APK)

# Publishes the current debug APKs to a rolling GitHub Release tagged
# `debug-latest`, so testers get a stable download link without needing an
# Actions login. Debug builds only; the signed release process is WP 14.
on:
  workflow_dispatch:
  push:
    branches: [main, ccr-ac6db77c-jcnexo]
    paths: ["app/**", ".github/workflows/debug-release.yml"]

permissions:
  contents: write

concurrency:
  group: debug-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.9"
  TAG: debug-latest

jobs:
  publish:
    name: Test, build and publish debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies (pinned)
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Verify generated code is current
        working-directory: app
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib

      - name: Format check
        working-directory: app
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        working-directory: app
        run: flutter test --coverage --reporter expanded

      # Stable test certificate (WP 14). A hosted runner has no debug keystore,
      # so Gradle generates a new one on every run and two CI builds then carry
      # different certificates; Android refuses to install one over the other
      # (an uninstall, and the data loss it brings, is needed). This step keeps
      # ONE standard Android debug identity across runs by restoring
      # ~/.android/debug.keystore from the Actions cache under a fixed key and
      # creating it with keytool only on a cache miss. If GitHub evicts the
      # cache entry (unused for 7 days, or cache over quota) a new keystore is
      # generated and testers must uninstall once; bump the key suffix only to
      # force that on purpose. The keystore is never committed: the engineering
      # standards (section 9) forbid committing keystores, and a debug identity
      # with the public password "android" signs test builds only, never a
      # release. The certificate SHA-256 appears in the "Verify APK signatures
      # and metadata" step (apksigner --print-certs).
      - name: Restore stable debug keystore (cache)
        id: debug-keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: repforge-debug-keystore-v1

      - name: Create debug keystore on cache miss
        if: steps.debug-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "Generated a new debug keystore (cache miss); the cache saves it at the end of the job."

      - name: Build per-ABI and universal debug APKs
        working-directory: app
        run: |
          flutter build apk --debug --split-per-abi
          flutter build apk --debug
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk   ../dist/RepForge-debug-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk ../dist/RepForge-debug-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-debug.apk             ../dist/RepForge-debug-universal.apk
          ls -l ../dist
          (cd ../dist && sha256sum *.apk | tee SHA256SUMS.txt)

      # WP 14 release verification: every published APK is checked for a
      # valid signature and its package id and version are printed, so the
      # release evidence does not rely on the build step alone. `--print-certs`
      # includes the signer certificate SHA-256, which stays the same from run
      # to run now that the debug keystore is restored from the cache.
      - name: Verify APK signatures and metadata
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in dist/*.apk; do
            echo "== $apk"
            "$tools/apksigner" verify --print-certs "$apk"
            "$tools/aapt2" dump badging "$apk" | grep -E "^package:|^application-label:|sdkVersion|targetSdkVersion"
          done

      - name: Write release notes
        run: |
          {
            echo "RepForge debug build, rolling release."
            echo
            echo "- Commit: ${GITHUB_SHA} (branch ${GITHUB_REF_NAME})"
            echo "- Built: $(date -u +%Y-%m-%dT%H:%MZ) by run ${GITHUB_RUN_ID}"
            echo "- Flutter ${FLUTTER_VERSION}"
            echo
            echo "Most phones made since 2017 need RepForge-debug-arm64-v8a.apk. Use the universal APK if unsure."
            echo "These are unsigned-for-store debug builds for testing only; Android will warn about an unknown source."
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
          cat notes.md

      - name: Move tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --title "RepForge debug build (latest)" --notes-file notes.md --target "$GITHUB_SHA"
          else
            gh release create "$TAG" --prerelease --title "RepForge debug build (latest)" --notes-file notes.md --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" dist/RepForge-debug-arm64-v8a.apk dist/RepForge-debug-armeabi-v7a.apk dist/RepForge-debug-universal.apk dist/SHA256SUMS.txt --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'
