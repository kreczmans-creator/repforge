  # The CI job "Recovery (process kill, large profile)" (ci.yml, job
  # `recovery`, every push) runs kill and heavy.
  kill:
    skip: "Process-kill suite; run with --run-skipped --tags \"kill || heavy\" --concurrency=1"
  # WS5: the large profile (5,000 exercises, 100,000 sets) and host timing.
  heavy:
    skip: "Large-profile suite; run with --run-skipped --tags \"kill || heavy\" --concurrency=1"
