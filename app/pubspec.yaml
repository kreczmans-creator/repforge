name: repforge
description: "RepForge: fitness, nutrition and body-composition tracking for Android and iOS."
publish_to: "none"

# Semantic version + build number. Changed only by the release process.
version: 0.4.0+1

environment:
  # Pinned toolchain: Flutter 3.47.9 / Dart 3.13.7 (see .fvmrc and CI).
  sdk: ">=3.13.7 <4.0.0"
  flutter: ">=3.47.9"

# All versions are exact pins (ADR-0002 acceptance direction). Upgrade only
# through a reviewed change that re-runs the full test suite on both platforms.
dependencies:
  cupertino_icons: 1.0.8
  dio: 5.11.1
  drift: 2.35.3
  drift_flutter: 0.3.1
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.2
  flutter_riverpod: 3.4.3
  freezed_annotation: 3.1.0
  go_router: 18.1.2
  intl: 0.20.3
  meta: 1.19.0
  mobile_scanner: 7.5.0
  path_provider: 2.1.6
  permission_handler: 12.0.1
  share_plus: 13.3.1
  # Direct pin so the bundled native SQLite version is explicit, even though
  # only drift_flutter imports it.
  sqlite3: 3.8.0
  timezone: 0.11.2
  uuid: 4.6.0

dev_dependencies:
  build_runner: 2.17.1
  drift_dev: 2.35.2
  flutter_test:
    sdk: flutter
  freezed: 4.0.3
  integration_test:
    sdk: flutter
  mocktail: 1.0.5
  path: 1.9.1
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/logo/
    - assets/brand/logo/2.0x/
    - assets/brand/logo/3.0x/
    - assets/brand/icons/
    - assets/seed/
    - assets/catalogue/reference/
    - assets/catalogue/releases/

  # Brand typography (SIL OFL; see assets/fonts/LICENSE.md).
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-500.ttf
          weight: 500
        - asset: assets/fonts/Sora-600.ttf
          weight: 600
        - asset: assets/fonts/Sora-700.ttf
          weight: 700
        - asset: assets/fonts/Sora-800.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-600.ttf
          weight: 600
